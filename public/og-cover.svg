<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9ee"/>
      <stop offset="1" stop-color="#eeeaff"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8986f3"/>
      <stop offset=".55" stop-color="#625be4"/>
      <stop offset="1" stop-color="#453bb1"/>
    </linearGradient>
    <radialGradient id="sun" cx=".32" cy=".25" r=".8">
